<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>check.</title>
<style>
p{
	margin: 0;
}
p.label{
	margin-top: 2em;
	font-weight: bold;
}
</style>
</head>
<body>
<p class="label">navigator.userAgent</p>
<p id="res"></p>
<p class="label">document.referrer</p>
<p id="res2"></p>
<hr>
<p class="label">classify</p>
<p id="res3"></p>
<script>
  
let _ua = navigator.userAgent;
let _ref = document.referrer;

document.getElementById('res').innerHTML = _ua;
document.getElementById('res2').innerHTML = _ref;

let __ua = _ua.toLowerCase();
let __ref = _ref.toLowerCase();

//	モバイルのAndroid
if( __ua.indexOf('android') != -1 && __ua.indexOf('mobile') )
{
	//	android mobile
	if( __ua.indexOf('twitterandroid') != -1 || __ref.indexOf('twitter') != -1 || __ref.indexOf('t.co') != -1 )
	{
		//	x のアプリ内ブラウザ
		document.getElementById('res3').innerHTML = 'AndroidのX内ブラウザ環境です';
	}

	if( __ua.indexOf('line') != -1 )
	{
		//	lineのアプリ内ブラウザ
		document.getElementById('res3').innerHTML = 'AndroidのLINE内ブラウザ環境です';
	}
}



//	rifara-
twitter.android


</script>

</body>
</html>
